line-length = 100
target-version = "py311"

[lint]
extend-select = ["I", "B", "UP"]
# prose_check.py probes git best-effort and falls back to the working directory, and the
# gates build multi-line messages from adjacent string literals on purpose.
ignore = ["BLE001", "S110", "ISC004"]

[lint.isort]
known-first-party = ["git_quality_gates"]
