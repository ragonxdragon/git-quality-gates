[project]
name = "git-quality-gates"
version = "0.1.0"
description = "Git hooks and CI gates for commit messages, comments, prose, licenses and regression tests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Hall" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
git-quality-gates = "git_quality_gates.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_quality_gates"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
